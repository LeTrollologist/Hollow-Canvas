<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1326"/>
      <stop offset="50%" stop-color="#070A14"/>
      <stop offset="100%" stop-color="#03050A"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EF2E8"/>
      <stop offset="50%" stop-color="#46C5BD"/>
      <stop offset="100%" stop-color="#1A7C75"/>
    </linearGradient>

    <!-- Purple Nebula Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="50%" stop-color="#A29BFE"/>
      <stop offset="100%" stop-color="#E056FD"/>
    </linearGradient>

    <!-- Stylus Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </linearGradient>

    <!-- Radial Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded App Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1F2847" stroke-width="6"/>

  <!-- Subtle Studio Grid Overlay in Background -->
  <path d="M128 48 v416 M256 48 v416 M384 48 v416 M48 128 h416 M48 256 h416 M48 384 h416" 
        stroke="#18223C" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Outer Glowing Geometric Rings (Mandala & Symmetry Motif) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.35" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-dasharray="6 12" opacity="0.45" />

  <!-- Dynamic Brush Arc (Cubic Spline Paint Stroke) -->
  <path d="M 120 360 C 140 200, 260 140, 390 190 C 320 270, 210 320, 160 380 Z" 
        fill="url(#cyanGrad)" opacity="0.85" filter="url(#glow)"/>

  <path d="M 140 370 C 200 240, 310 180, 380 280 C 280 340, 210 380, 140 370 Z" 
        fill="url(#purpleGrad)" opacity="0.7" filter="url(#glow)"/>

  <!-- Precision Stylus Pen Crossing Diagonal -->
  <g transform="rotate(-45 256 256)">
    <!-- Pen Body Shadow -->
    <rect x="242" y="70" width="28" height="280" rx="14" fill="#050811" opacity="0.8"/>
    
    <!-- Pen Barrel -->
    <rect x="244" y="65" width="24" height="270" rx="12" fill="#1A2035" stroke="#3D4B75" stroke-width="3"/>
    <rect x="249" y="80" width="14" height="120" rx="7" fill="#283353"/>

    <!-- Stylus Grip & Ring -->
    <rect x="242" y="235" width="28" height="55" rx="6" fill="#0C101D" stroke="url(#cyanGrad)" stroke-width="2"/>
    <rect x="240" y="225" width="32" height="6" rx="3" fill="url(#goldGrad)"/>

    <!-- Stylus Cone Nib -->
    <polygon points="244,290 268,290 256,345" fill="#3D4B75"/>
    <polygon points="250,330 262,330 256,355" fill="url(#cyanGrad)" filter="url(#strongGlow)"/>

    <!-- Tip Sparkle / Light Burst -->
    <circle cx="256" cy="358" r="6" fill="#FFFFFF" filter="url(#strongGlow)"/>
  </g>

  <!-- Glowing Focal Point Sparkles -->
  <path d="M 370 120 Q 370 140 390 140 Q 370 140 370 160 Q 370 140 350 140 Q 370 140 370 120 Z" fill="#7EF2E8" filter="url(#glow)"/>
  <circle cx="370" cy="140" r="3" fill="#FFFFFF"/>

  <path d="M 130 180 Q 130 195 145 195 Q 130 195 130 210 Q 130 195 115 195 Q 130 195 130 180 Z" fill="#A29BFE" filter="url(#glow)"/>
  <circle cx="130" cy="195" r="2.5" fill="#FFFFFF"/>
</svg>

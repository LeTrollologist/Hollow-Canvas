<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm ink frame -->
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A120B" />
      <stop offset="100%" stop-color="#0B0806" />
    </linearGradient>

    <!-- Golden-hour accent ramp -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6C45A" />
      <stop offset="55%" stop-color="#E8963F" />
      <stop offset="100%" stop-color="#E4705F" />
    </linearGradient>

    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6C45A" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#F6C45A" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#inkGrad)" stroke="#3E2F25" stroke-width="6" />

  <!-- Warm studio grid -->
  <path d="M128 48 v416 M256 48 v416 M384 48 v416 M48 128 h416 M48 256 h416 M48 384 h416"
        stroke="#2A1D12" stroke-width="2" stroke-dasharray="4 8" opacity="0.7" />

  <!-- Bloom behind the mark -->
  <circle cx="256" cy="256" r="190" fill="url(#bloom)" />

  <!-- Symmetry rings -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#F6C45A" stroke-width="3" opacity="0.35" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#E8963F" stroke-width="2" stroke-dasharray="6 12" opacity="0.5" />

  <!-- Diagonal stylus (parchment barrel, gold grip, coral nib) -->
  <g transform="rotate(45 256 256)">
    <line x1="256" y1="96" x2="256" y2="392" stroke="#F3E7D6" stroke-width="15" stroke-linecap="round" opacity="0.92" />
    <line x1="256" y1="286" x2="256" y2="344" stroke="url(#goldGrad)" stroke-width="21" stroke-linecap="round" />
    <polygon points="248,386 264,386 256,404" fill="#E4705F" />
    <circle cx="256" cy="404" r="5" fill="#FFF7EA" filter="url(#glow)" />
  </g>

  <!-- The Aurelia "A" prism -->
  <path d="M 168 340 L 256 156 L 344 340" fill="none" stroke="url(#goldGrad)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 214 274 L 298 274" fill="none" stroke="#E8963F" stroke-width="24" stroke-linecap="round" />

  <!-- Sparkles -->
  <path d="M 372 134 Q 372 158 396 158 Q 372 158 372 182 Q 372 158 348 158 Q 372 158 372 134 Z" fill="#F3E7D6" filter="url(#glow)" />
  <path d="M 140 190 Q 140 206 156 206 Q 140 206 140 222 Q 140 206 124 206 Q 140 206 140 190 Z" fill="#F6C45A" filter="url(#glow)" />
  <path d="M 392 330 Q 392 342 404 342 Q 392 342 392 354 Q 392 342 380 342 Q 392 342 392 330 Z" fill="#3FA796" filter="url(#glow)" />
</svg>

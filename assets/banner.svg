<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050B" />
      <stop offset="50%" stop-color="#080D1D" />
      <stop offset="100%" stop-color="#04060E" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5CE0D8" />
      <stop offset="50%" stop-color="#A89EE0" />
      <stop offset="100%" stop-color="#E28BF0" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5CE0D8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#267885" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E1E6F7" />
      <stop offset="100%" stop-color="#99AACC" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141D38" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0B1021" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#131B36" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#5CE0D8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="420" fill="url(#bgGrad)" />

  <!-- Subtle Studio Grid Overlay -->
  <rect width="1280" height="420" fill="url(#grid)" />

  <!-- Glowing Ambient Lights -->
  <circle cx="200" cy="100" r="180" fill="#5CE0D8" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1080" cy="320" r="220" fill="#A89EE0" opacity="0.14" filter="url(#softGlow)" />
  <circle cx="640" cy="210" r="150" fill="#7C6EE6" opacity="0.08" filter="url(#softGlow)" />

  <!-- Geometric Decorative Lines & Symmetry Reticles -->
  <g stroke="#26345E" stroke-width="1" opacity="0.6">
    <line x1="80" y1="50" x2="1200" y2="50" stroke-dasharray="6,6" />
    <line x1="80" y1="370" x2="1200" y2="370" stroke-dasharray="6,6" />
    <line x1="80" y1="50" x2="80" y2="370" stroke-dasharray="6,6" />
    <line x1="1200" y1="50" x2="1200" y2="370" stroke-dasharray="6,6" />
    
    <!-- Corner Crosshairs -->
    <path d="M 70 50 L 90 50 M 80 40 L 80 60" stroke="#5CE0D8" stroke-width="1.5" />
    <path d="M 1190 50 L 1210 50 M 1200 40 L 1200 60" stroke="#5CE0D8" stroke-width="1.5" />
    <path d="M 70 370 L 90 370 M 80 360 L 80 380" stroke="#5CE0D8" stroke-width="1.5" />
    <path d="M 1190 370 L 1210 370 M 1200 360 L 1200 380" stroke="#5CE0D8" stroke-width="1.5" />
  </g>

  <!-- Central Logo Emblem: The Crystalline Prism & Stylus -->
  <g transform="translate(140, 210)">
    <!-- Outer Glow Diamond -->
    <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" filter="url(#glow)" opacity="0.8" />
    <!-- Inner Nested Frame -->
    <polygon points="0,-50 50,0 0,50 -50,0" fill="#0C142C" stroke="#3D5082" stroke-width="1.5" />
    <!-- Core Stylus / Prism Glyph -->
    <path d="M -15,-20 L 0,-45 L 15,-20 L 0,35 Z" fill="url(#cyanPurple)" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" filter="url(#glow)" />
    <!-- Orbiting Symmetry Rings -->
    <circle cx="0" cy="0" r="62" fill="none" stroke="#5CE0D8" stroke-width="1" stroke-dasharray="4,8" opacity="0.5" />
  </g>

  <!-- Main Title & Typography -->
  <!-- Main Heading -->
  <text x="250" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="4" fill="url(#textGrad)">
    HOLLOW CANVAS
  </text>

  <!-- Accent Glow Sub-Line -->
  <path d="M 250 200 L 1140 200" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glow)" />

  <!-- Subtitle -->
  <text x="252" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#889BBF">
    GRAPHICS STUDIO · PURE RUST DIGITAL PAINTING ENGINE
  </text>

  <!-- Feature Badges -->
  <g transform="translate(252, 265)">
    <!-- Badge 1: Pure Rust -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="6" fill="url(#badgeGrad)" stroke="#2C3D6B" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#E28BF0" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#DDE6FF" letter-spacing="0.5">100% RUST</text>
    </g>

    <!-- Badge 2: Catmull-Rom Splines -->
    <g transform="translate(142, 0)">
      <rect width="190" height="34" rx="6" fill="url(#badgeGrad)" stroke="#2C3D6B" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#5CE0D8" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#DDE6FF" letter-spacing="0.5">CATMULL-ROM SPLINES</text>
    </g>

    <!-- Badge 3: Local-First / Zero Telemetry -->
    <g transform="translate(344, 0)">
      <rect width="170" height="34" rx="6" fill="url(#badgeGrad)" stroke="#2C3D6B" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#A89EE0" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#DDE6FF" letter-spacing="0.5">ZERO TELEMETRY</text>
    </g>

    <!-- Badge 4: Multi-Layer & Symmetry -->
    <g transform="translate(526, 0)">
      <rect width="180" height="34" rx="6" fill="url(#badgeGrad)" stroke="#2C3D6B" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#5CE0D8" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#DDE6FF" letter-spacing="0.5">RADIAL SYMMETRY</text>
    </g>
  </g>

  <!-- Version Tag in Corner -->
  <text x="1170" y="355" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" fill="#475B82" letter-spacing="2">
    v0.1.0 · PRODUCTION
  </text>
</svg>

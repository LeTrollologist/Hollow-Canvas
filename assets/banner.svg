<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="100%" height="100%">
  <defs>
    <!-- Warm ink background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0806" />
      <stop offset="50%" stop-color="#17100A" />
      <stop offset="100%" stop-color="#0B0806" />
    </linearGradient>

    <!-- Golden-hour accent ramp -->
    <linearGradient id="goldRamp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6C45A" />
      <stop offset="50%" stop-color="#E8963F" />
      <stop offset="100%" stop-color="#E4705F" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF7EA" />
      <stop offset="45%" stop-color="#F3E7D6" />
      <stop offset="100%" stop-color="#B99C74" />
    </linearGradient>

    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241A12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#120D09" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2A1D12" stroke-width="1" stroke-opacity="0.55" />
      <circle cx="40" cy="40" r="1" fill="#F6C45A" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="420" fill="url(#bgGrad)" />
  <rect width="1280" height="420" fill="url(#grid)" />

  <!-- Ambient golden-hour light -->
  <circle cx="210" cy="110" r="180" fill="#F6C45A" opacity="0.10" filter="url(#softGlow)" />
  <circle cx="1060" cy="320" r="220" fill="#E4705F" opacity="0.10" filter="url(#softGlow)" />
  <circle cx="650" cy="210" r="150" fill="#E8963F" opacity="0.07" filter="url(#softGlow)" />

  <!-- Studio reticle frame -->
  <g stroke="#3E2F25" stroke-width="1" opacity="0.75">
    <line x1="80" y1="50" x2="1200" y2="50" stroke-dasharray="6,6" />
    <line x1="80" y1="370" x2="1200" y2="370" stroke-dasharray="6,6" />
    <line x1="80" y1="50" x2="80" y2="370" stroke-dasharray="6,6" />
    <line x1="1200" y1="50" x2="1200" y2="370" stroke-dasharray="6,6" />

    <path d="M 70 50 L 90 50 M 80 40 L 80 60" stroke="#F6C45A" stroke-width="1.5" />
    <path d="M 1190 50 L 1210 50 M 1200 40 L 1200 60" stroke="#F6C45A" stroke-width="1.5" />
    <path d="M 70 370 L 90 370 M 80 360 L 80 380" stroke="#F6C45A" stroke-width="1.5" />
    <path d="M 1190 370 L 1210 370 M 1200 360 L 1200 380" stroke="#F6C45A" stroke-width="1.5" />
  </g>

  <!-- Emblem: the Aurelia "A" prism -->
  <g transform="translate(150, 210)">
    <polygon points="0,-72 72,0 0,72 -72,0" fill="none" stroke="url(#goldRamp)" stroke-width="2.5" filter="url(#glow)" opacity="0.85" />
    <polygon points="0,-50 50,0 0,50 -50,0" fill="#14100C" stroke="#4A3626" stroke-width="1.5" />

    <path d="M -30,26 L 0,-32 L 30,26" fill="none" stroke="url(#goldRamp)" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -13,6 L 13,6" fill="none" stroke="#E8963F" stroke-width="7" stroke-linecap="round" />

    <circle cx="0" cy="-32" r="4" fill="#FFF7EA" filter="url(#glow)" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#F6C45A" stroke-width="1" stroke-dasharray="4,8" opacity="0.55" />
  </g>

  <!-- Title -->
  <text x="250" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="900" letter-spacing="9" fill="url(#textGrad)">
    AURELIA
  </text>

  <path d="M 250 200 L 1140 200" stroke="url(#goldRamp)" stroke-width="3" filter="url(#glow)" />

  <text x="252" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#B99C74">
    RASTER &amp; ANIMATION STUDIO · PURE RUST ENGINE
  </text>

  <!-- Feature chips -->
  <g transform="translate(252, 265)">
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="6" fill="url(#chipGrad)" stroke="#4A3626" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#F6C45A" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F3E7D6" letter-spacing="0.5">100% RUST</text>
    </g>

    <g transform="translate(142, 0)">
      <rect width="190" height="34" rx="6" fill="url(#chipGrad)" stroke="#4A3626" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#E8963F" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F3E7D6" letter-spacing="0.5">STYLUS PRESSURE</text>
    </g>

    <g transform="translate(344, 0)">
      <rect width="170" height="34" rx="6" fill="url(#chipGrad)" stroke="#4A3626" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#3FA796" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F3E7D6" letter-spacing="0.5">ZERO TELEMETRY</text>
    </g>

    <g transform="translate(526, 0)">
      <rect width="180" height="34" rx="6" fill="url(#chipGrad)" stroke="#4A3626" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4" fill="#E4705F" filter="url(#glow)" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F3E7D6" letter-spacing="0.5">RADIAL SYMMETRY</text>
    </g>
  </g>

  <text x="1170" y="355" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" font-weight="600" fill="#7A6248" letter-spacing="2">
    v2.2.1 · PRODUCTION
  </text>
</svg>

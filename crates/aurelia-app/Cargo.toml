[package]
name = "aurelia-app"
version = "3.0.2"
edition = "2021"
description = "Aurelia - local-first raster illustration, animation and painting studio (Windows)"

[[bin]]
name = "aurelia-app"
path = "src/main.rs"
test = false

[dependencies]
aurelia-core = { path = "../aurelia-core", version = "3.0.2" }
aurelia-io = { path = "../aurelia-io", version = "3.0.2" }
aurelia-ui = { path = "../aurelia-ui", version = "3.0.2" }
aurelia-render = { path = "../aurelia-render", version = "3.0.2" }
egui = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }

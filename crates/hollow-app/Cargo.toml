[package]
name = "hollow-app"
version = "1.0.3-alpha"
edition = "2021"
description = "Universal cross-platform digital painting and graphics studio application"

[[bin]]
name = "hollow-app"
path = "src/main.rs"
test = false

[dependencies]
hollow-core = { path = "../hollow-core", version = "1.0.3-alpha" }
hollow-io = { path = "../hollow-io", version = "1.0.3-alpha" }
hollow-ui = { path = "../hollow-ui", version = "1.0.3-alpha" }
hollow-render = { path = "../hollow-render", version = "1.0.3-alpha" }
egui = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }

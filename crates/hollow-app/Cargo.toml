[package]
name = "hollow-app"
version = "0.16.0"
edition = "2021"
description = "Pure native Windows graphics studio application executable"

[[bin]]
name = "hollow-app"
path = "src/main.rs"
test = false

[dependencies]
hollow-core = { path = "../hollow-core", version = "0.16.0" }
hollow-io = { path = "../hollow-io", version = "0.16.0" }
hollow-ui = { path = "../hollow-ui", version = "0.16.0" }
hollow-render = { path = "../hollow-render", version = "0.16.0" }
egui = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
image = { workspace = true }

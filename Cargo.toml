[workspace]
members = [
    "crates/hollow-core",
    "crates/hollow-render",
    "crates/hollow-io",
    "crates/hollow-ui",
    "crates/hollow-app",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
glam = { version = "0.28", features = ["serde"] }
rayon = "1.10"
bytemuck = { version = "1.18", features = ["derive"] }
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
rfd = "0.14"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

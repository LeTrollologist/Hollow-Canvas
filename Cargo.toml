[workspace]
members = [
    "crates/aurelia-core",
    "crates/aurelia-render",
    "crates/aurelia-io",
    "crates/aurelia-ui",
    "crates/aurelia-presence",
    "crates/aurelia-app",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "tga", "ico"] }
glam = { version = "0.28", features = ["serde"] }
rayon = "1.10"
bytemuck = { version = "1.18", features = ["derive"] }
egui = "0.28"
rfd = "0.14"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
ab_glyph = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
